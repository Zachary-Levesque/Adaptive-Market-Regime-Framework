data:
  universe:
    - NVDA
    - TSM
    - AMD
    - CIEN
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - JPM
    - GS
    - SPY
    - QQQ
    - TLT
    - GLD
    - HYG
    - LQD
    - ^VIX
  start_date: "2007-01-01"
  end_date: "today"
  benchmark: "SPY"
  cache_dir: "data/raw"
  processed_dir: "data/processed"
  local_data_dir: "data/raw"
  allow_remote_downloads: true
  stooq_api_key:

regime:
  n_regimes: 4
  n_iter: 1000
  covariance_type: "full"
  regime_names:
    0: "Bull Trending"
    1: "Low-Vol Compression"
    2: "Bear Trending"
    3: "High-Vol Crisis"

alpha:
  target_horizon: 10
  diagnostics_path: "data/processed/alpha_diagnostics.parquet"
  comparison_path: "data/processed/alpha_model_comparison.parquet"
  signals_dir: "data/processed/alpha_signals"
  selection_path: "data/processed/alpha_signal_selection.parquet"
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
    sequence_length: 60
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  walk_forward:
    train_window: 252
    test_window: 126
    step_size: 63

rl:
  total_timesteps: 1000000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  initial_capital: 100000
  model_path: "models/ppo_position_sizer.zip"
  positions_path: "data/processed/rl_positions.parquet"
  backtest_results_path: "data/results/rl_backtest_results.parquet"
  comparison_path: "data/results/rl_vs_baseline_comparison.parquet"
  training_history_path: "data/results/ppo_training_curves.parquet"
  train_start: "2007-01-01"
  train_end: "2018-12-31"
  validation_start: "2019-01-01"
  validation_end: "2021-12-31"
  test_start: "2022-01-01"
  test_end: "today"

execution:
  max_single_trade_size: 0.25
  slippage_coefficient: 0.35
  slippage_floor_bps: 0.5
  etf_cost_bps: 5.0
  large_cap_cost_bps: 12.0
  small_mid_cost_bps: 18.0

risk:
  n_simulations: 10000
  confidence_level: 0.95
  output_dir: "data/results"
  transaction_cost_bps: 10.0
  max_gross_exposure: 1.0
  long_fraction: 0.2
  short_fraction: 0.0
  rebalance_interval_days: 5
  weighting_method: "inverse_volatility"
  volatility_lookback: 21
  volatility_floor: 0.005
  max_position_weight: 0.25
  benchmark_blend_enabled: true
  benchmark_blend_default_alpha_exposure: 0.25
  benchmark_blend_regime_exposures:
    0: 0.0
    1: 0.25
    2: 0.25
    3: 0.75
  stress_periods:
    gfc: ["2008-09-01", "2009-03-31"]
    covid: ["2020-02-19", "2020-03-23"]
    rate_hike: ["2022-01-03", "2022-12-31"]
